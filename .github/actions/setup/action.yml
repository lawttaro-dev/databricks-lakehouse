name: setup
description: Python (uv), Java for local Spark, Delta jars cache and the Databricks CLI.

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v10
      with:
        enable-cache: true

    - name: Install project and dev dependencies (exactly uv.lock)
      shell: bash
      run: uv sync --locked

    # pyspark needs a JVM; Spark 4 supports Java 17
    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: "17"

    # Delta jars are downloaded by Spark (Ivy) on the first session; keep them between runs
    - uses: actions/cache@v6
      with:
        path: ~/.ivy2.5.2
        key: ivy-${{ hashFiles('uv.lock') }}

    - uses: databricks/setup-cli@v1.23.0
