# Tag vX.Y.Z on a commit of main: tests again, then deploy that exact commit to prod.
# The prod environment requires a manual approval in GitHub before the deploy job starts.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history, to check the tag is on main
      - name: Tag must point to a commit on main (already deployed to qa)
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: ./.github/actions/setup
      - run: uv run ruff check .
      - run: uv run pytest

  deploy-prod:
    needs: test
    runs-on: ubuntu-latest
    environment: prod
    concurrency: deploy-prod
    env:
      DATABRICKS_AUTH_TYPE: oauth-m2m
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: databricks bundle deploy -t prod
