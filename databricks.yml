# Databricks Asset Bundle: one bundle, one target per environment.
# Environments are Unity Catalog catalogs in a single workspace (see docs/03-decisions.md, ADR-001).
bundle:
  name: lakehouse

include:
  - resources/*.yml

# The project wheel (src/lakehouse), built locally or in CI and uploaded on deploy
artifacts:
  default:
    type: whl
    build: uv build --wheel
    path: .

variables:
  catalog:
    description: Unity Catalog catalog that holds this environment's schemas and tables.

workspace:
  host: https://dbc-fc51ba90-7949.cloud.databricks.com

targets:
  dev:
    # Resources are prefixed with "[dev <user>]" and schedules are paused
    mode: development
    default: true
    variables:
      catalog: dev

  # qa/prod deploy into the home folder of the deploying identity (the environment's service
  # principal), not /Workspace/Shared, which every workspace user can write to. This is the
  # default path, set explicitly as production mode recommends.
  qa:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: qa

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: prod
