[project]
name = "lakehouse"
version = "0.1.0"
description = "Databricks lakehouse for a world bibliographic catalog"
authors = [
    { name = "Lautaro Puican", email = "352604299+lawttaro-dev@users.noreply.github.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "databricks-sdk>=0.161.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
lakehouse-extract = "lakehouse.extract.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "delta-spark>=4.0,<4.1",
    "pyspark>=4.0,<4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["explore"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
